# USEYI Monitor - Android build for Codemagic
# This project intentionally generates the Android platform on the Codemagic
# machine, so the GitHub repository stays small and the Android setup is
# always generated by the installed Flutter SDK.

workflows:
  android-apk:
    name: USEYI Monitor - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.upshift.useyi_monitor"
    scripts:
      - name: Create Android platform
        script: |
          set -e
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.upshift .
          fi

      - name: Configure Android package and camera permission
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          package = "com.upshift.useyi_monitor"
          android = Path("android")

          # Flutter templates have used both Groovy and Kotlin DSL over time.
          candidates = [android / "app" / "build.gradle", android / "app" / "build.gradle.kts"]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r'applicationId\s*(?:=)?\s*["\'][^"\']+["\']',
                            lambda m: m.group(0).split('"')[0] + f'"{package}"' if '"' in m.group(0) else f"applicationId = \"{package}\"",
                            text)
              text = re.sub(r'namespace\s*(?:=)?\s*["\'][^"\']+["\']',
                            lambda m: m.group(0).split('"')[0] + f'"{package}"' if '"' in m.group(0) else f"namespace = \"{package}\"",
                            text)
              path.write_text(text)

          manifest = android / "app" / "src" / "main" / "AndroidManifest.xml"
          text = manifest.read_text()
          if "android.permission.CAMERA" not in text:
              text = text.replace(
                  '<manifest',
                  '<manifest\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />',
                  1,
              )
          text = text.replace('android:label="useyi_monitor"', 'android:label="USEYI Monitor"')
          manifest.write_text(text)
          PY

      - name: Install packages
        script: flutter pub get

      - name: Check Dart code
        script: flutter analyze

      - name: Build Android release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/*.apk
